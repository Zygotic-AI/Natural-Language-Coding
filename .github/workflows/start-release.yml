name: start-release

# Fail-closed: preflight required binaries (missing => fail).
# Branch/tag probes proceed only on HTTP 404. 200 => exists (refuse).
# Any other HTTP status, missing status, or transport error => fail.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version matching ^v\\d+\\.\\d+\\.\\d+$"
        required: true
        type: string
      debug_hide_gh:
        description: "TEMPORARY debug: empty PATH so gh is missing (remove before final)"
        required: false
        type: boolean
        default: false
      debug_bogus_token:
        description: "TEMPORARY debug: overwrite GH_TOKEN with bogus (remove before final)"
        required: false
        type: boolean
        default: false

concurrency:
  group: nlc-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-release-branch:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Reject version that is not vX.Y.Z
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: version must match ^v[[:digit:]]+\\.[[:digit:]]+\\.[[:digit:]]+$ (got ${VERSION})"
            exit 1
          fi
          echo "version ${VERSION} accepted"

      - name: Preflight required binaries
        env:
          DEBUG_HIDE_GH: ${{ inputs.debug_hide_gh }}
        run: |
          set -euo pipefail
          if [[ "${DEBUG_HIDE_GH:-}" == "true" ]]; then
            export PATH=""
            echo "debug: PATH emptied to hide gh"
          fi
          for bin in gh; do
            path="$(command -v "${bin}" || true)"
            test -n "${path}" || { echo "ERROR: required binary missing: ${bin}"; exit 1; }
            echo "preflight: ${bin} -> ${path}"
          done

      - name: Mint start-release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.START_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.START_RELEASE_APP_PRIVATE_KEY }}

      - name: Create release branch from main HEAD
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          DEBUG_BOGUS_TOKEN: ${{ inputs.debug_bogus_token }}
        run: |
          set -euo pipefail
          if [[ "${DEBUG_BOGUS_TOKEN:-}" == "true" ]]; then
            GH_TOKEN="bogus"
            export GH_TOKEN
            echo "debug: GH_TOKEN replaced with bogus value"
          fi
          BRANCH="release/${VERSION}"

          # Proceed only on HTTP 404. 200 => exists (refuse).
          # Any other status, missing status, or transport error => fail.
          # Parse HTTP status explicitly. Do not treat command success as exists.
          probe_absent() {
            local path="$1"
            local label="$2"
            local raw ec status
            set +e
            raw="$(gh api --include --silent --method GET "${path}" 2>&1)"
            ec=$?
            set -e
            status="$(printf '%s\n' "${raw}" | tr -d '\r' | sed -n 's/^HTTP\/[0-9.]* \([0-9][0-9][0-9]\).*/\1/p' | tail -n 1)"
            case "${status}" in
              404)
                echo "${label} absent (HTTP 404)"
                ;;
              200)
                echo "ERROR: ${label} already exists"
                exit 1
                ;;
              *)
                echo "ERROR: ${label} existence probe failed (HTTP ${status:-<empty>}; gh exit ${ec})"
                printf '%s\n' "${raw}"
                exit 1
                ;;
            esac
          }

          probe_absent "repos/${REPO}/git/ref/heads/${BRANCH}" "branch ${BRANCH}"
          probe_absent "repos/${REPO}/git/ref/tags/${VERSION}" "tag ${VERSION}"
          SHA="$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)"
          test -n "${SHA}"
          gh api --method POST "repos/${REPO}/git/refs" \
            --field ref="refs/heads/${BRANCH}" \
            --field sha="${SHA}" \
            --jq '"created \(.ref) at \(.object.sha)"'
