name: start-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version matching ^v\\d+\\.\\d+\\.\\d+$"
        required: true
        type: string

concurrency:
  group: nlc-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-release-branch:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Reject version that is not vX.Y.Z
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: version must match ^v[[:digit:]]+\\.[[:digit:]]+\\.[[:digit:]]+$ (got ${VERSION})"
            exit 1
          fi
          echo "version ${VERSION} accepted"

      - name: Mint start-release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.START_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.START_RELEASE_APP_PRIVATE_KEY }}

      - name: Create release branch from main HEAD
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="release/${VERSION}"
          if gh api --silent "repos/${REPO}/git/ref/heads/${BRANCH}"; then
            echo "ERROR: branch ${BRANCH} already exists"
            exit 1
          fi
          if gh api --silent "repos/${REPO}/git/ref/tags/${VERSION}"; then
            echo "ERROR: tag ${VERSION} already exists"
            exit 1
          fi
          SHA="$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)"
          test -n "${SHA}"
          gh api --method POST "repos/${REPO}/git/refs" \
            --field ref="refs/heads/${BRANCH}" \
            --field sha="${SHA}" \
            --jq '"created \(.ref) at \(.object.sha)"'
