name: history-rewrite-invariant

on:
  push:
  pull_request:

jobs:
  rewrite-invariant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ADR 0050 history rewrite drill
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
        run: python3 tools/assert-history-rewrite-invariant-passes.py
