name: history-rewrite-invariant

on:
  workflow_call:

jobs:
  rewrite-invariant:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ADR 0050 history rewrite drill
        run: python3 tools/assert-history-rewrite-invariant-passes.py
