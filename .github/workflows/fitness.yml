name: fitness

on:
  push:
  pull_request:

jobs:
  fitness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hub fitness suite
        run: bash tools/ci-fitness.sh

      - name: NLC verify (policy + fingerprints)
        run: python3 tools/nlc.py --project . verify

  piped-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Piped install.sh smoke (file-backed raw bootstrap)
        env:
          NLC_RAW_BASE: file://${{ github.workspace }}
          NLC_SKIP_VERIFY: "1"
          NLC_INSTALL_ROOT: ${{ runner.temp }}/nlc-piped-install
        run: |
          curl -fsSL "file://${{ github.workspace }}/scripts/install.sh" | bash
