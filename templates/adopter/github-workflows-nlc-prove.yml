# Copy to your app repo: .github/workflows/nlc-prove.yml
# Adjust paths if NLC_HUB is not the default install.

name: nlc-prove

on:
  pull_request:
  push:
    branches: [main]

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Adopter fitness
        run: |
          HUB="${NLC_HUB:-$HOME/.local/share/nlc/hub}"
          if [ -f "$HUB/tools/ci_fitness.py" ]; then
            python3 "$HUB/tools/ci_fitness.py"
          else
            echo "configure NLC_HUB or add your adopter fitness command here"
            exit 1
          fi
